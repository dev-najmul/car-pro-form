name: Check live GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check real Places, private Routes preview and complete booking flow
        run: node scripts/check-live-pages.mjs
      - name: Check real Bangladesh locations, route identities, waiting and all vehicle quotes
        run: node scripts/check-live-bangladesh.mjs
      - name: Check device-location quality, manual map correction and confirmation with real Google services
        run: node scripts/check-live-device-location.mjs
      - name: Save live screenshots and sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-results
          path: |
            test-results/live-pages/*.png
            test-results/live-pages/report.json
            test-results/live-bangladesh/*.png
            test-results/live-bangladesh/report.json
            test-results/live-device-location/*.png
            test-results/live-device-location/report.json
          retention-days: 7
          if-no-files-found: warn
